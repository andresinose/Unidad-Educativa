services:
  api:
    build:
      context: ../apps/api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GENERATION_MODEL=${GENERATION_MODEL:-claude-sonnet-5}
      - CORS_ORIGINS=http://localhost:8080
    volumes:
      - api_sessions:/app/var/sessions

  web:
    build:
      context: ../apps/web
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  api_sessions:
